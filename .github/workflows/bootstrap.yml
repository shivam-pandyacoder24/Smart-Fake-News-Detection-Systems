name: Bootstrap, train, evaluate and publish NewsGuard

on:
  push:
    branches: [main]
    paths:
      - "source_bundle.*.b64"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsguard-bootstrap
  cancel-in-progress: false

jobs:
  build-train-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct and extract full project source
        shell: bash
        run: |
          set -euo pipefail
          cat source_bundle.*.b64 > /tmp/newsguard.tar.xz.b64
          base64 --decode /tmp/newsguard.tar.xz.b64 > /tmp/newsguard.tar.xz
          tar -xJf /tmp/newsguard.tar.xz --strip-components=1
          rm -f source_bundle.*.b64 /tmp/newsguard.tar.xz.b64 /tmp/newsguard.tar.xz
          test -s app/streamlit_app.py
          test -s src/train_model.py
          test -s requirements.txt
          test -s src/report.py

      - name: Make the project package importable by Streamlit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path("app/streamlit_app.py")
          source = app.read_text(encoding="utf-8")
          needle = "import streamlit as st\n\nfrom src.preprocessing import clean_text"
          replacement = (
              "import streamlit as st\n\n"
              "# Streamlit executes this file from app/; add the repository root for src imports.\n"
              "import sys\n"
              "PROJECT_ROOT = Path(__file__).resolve().parents[1]\n"
              "if str(PROJECT_ROOT) not in sys.path:\n"
              "    sys.path.insert(0, str(PROJECT_ROOT))\n\n"
              "from src.preprocessing import clean_text"
          )
          if needle in source:
              source = source.replace(needle, replacement, 1)
          elif "sys.path.insert(0, str(PROJECT_ROOT))" not in source:
              raise SystemExit("Could not safely locate the Streamlit import block")
          app.write_text(source, encoding="utf-8")
          PY
          python -m py_compile app/streamlit_app.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium

      - name: Download the labeled Fake/Real news dataset
        run: python scripts/download_dataset.py --source huggingface

      - name: Prepare the dataset and run automated tests
        run: |
          python scripts/prepare_data.py
          python scripts/smoke_check.py
          pytest -q

      - name: Train and compare Logistic Regression and Multinomial Naive Bayes
        run: python -m src.train_model

      - name: Launch Streamlit and capture genuine UI screenshots and demo video
        shell: bash
        run: |
          set -euo pipefail
          nohup streamlit run app/streamlit_app.py \
            --server.address 127.0.0.1 --server.port 8501 --server.headless true \
            > /tmp/newsguard-streamlit.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8501/_stcore/health
          python scripts/capture_app_evidence.py
          test -s demo/NewsGuard_Demo.webm
          test -s screenshots/01_news_detector.png
          test -s screenshots/03_sample_prediction.png

      - name: Verify actual trained artifacts, metrics, screenshots and report
        run: |
          test -s models/model.joblib
          test -s models/tfidf_vectorizer.joblib
          test -s models/metadata.json
          test -s outputs/evaluation_results/model_metrics.json
          test -s outputs/evaluation_results/model_comparison.csv
          test -s outputs/evaluation_results/evaluation_summary.md
          test -s outputs/visualizations/model_comparison.png
          test -s Project_Report.pdf

          test -s Project_Report.pdf

      - name: Refresh submission status and demo documentation
        shell: bash
        run: |
          cat > README.md <<'EOF'
          # NewsGuard — Smart Fake News Detection System

          **Major Project | AI/ML with Python | Python · NLP · TF-IDF · Scikit-learn · Streamlit**

          NewsGuard is an educational text-classification system that accepts a news headline or article and estimates whether its textual patterns resemble examples labeled **Fake** or **Real** in a labeled training corpus.

          > **Responsible use:** This model is not a definitive fact-checker. It learns patterns from historical training examples and cannot independently verify claims, sources, citations or breaking news. Predictions can be wrong.

          ## Dataset and attribution

          - Original source: [Fake and Real News Dataset by Clément Bisaillon (Kaggle)](https://www.kaggle.com/datasets/clmentbisaillon/fake-and-real-news-dataset)
          - Download mirror: [haoxianc/gilchr_fake-and-real-news-dataset (Hugging Face)](https://huggingface.co/datasets/haoxianc/gilchr_fake-and-real-news-dataset)
          - Fields include title, article text, subject, date and target label.
          - The mirror's labels are `0 = Real`, `1 = Fake`; the downloader converts these into the application's mapping `0 = Fake`, `1 = Real`.
          - The raw CSV is downloaded at build time and is not redistributed in this repository. Dataset attribution and download instructions are in `data/README.md`; provenance is recorded in `data/raw/dataset_source.json`.

          ## Machine-learning methodology

          1. Handle missing content and labels, normalize text, and remove duplicate article records.
          2. Explore class distribution and article-length patterns.
          3. Split the cleaned corpus into stratified 80% train and 20% test partitions (random seed 42).
          4. Fit TF-IDF on the training partition only; transform test and user-submitted text with the fitted vectorizer to prevent data leakage.
          5. Train Logistic Regression and Multinomial Naive Bayes on the same feature matrix.
          6. Compare accuracy, macro precision, macro recall, macro F1, classification reports and confusion matrices.
          7. Select by macro F1, save the estimator and fitted TF-IDF vectorizer with Joblib, and load the saved artifacts in Streamlit without retraining at inference time.

          ## Measured held-out results

          The held-out evaluation contains **7,766 articles**. The selected model is **Logistic Regression**, which achieved the higher macro F1.

          | Model | Accuracy | Macro precision | Macro recall | Macro F1 |
          |---|---:|---:|---:|---:|
          | Logistic Regression | **99.21%** | **99.23%** | **99.19%** | **99.21%** |
          | Multinomial Naive Bayes | 96.05% | 96.03% | 96.01% | 96.02% |

          The cleaned corpus contains **38,827 articles**: 17,901 Fake and 20,926 Real. The preprocessing step removed 6,071 duplicate articles. Detailed values, classification reports and confusion matrices are in `outputs/evaluation_results/`; charts are in `outputs/visualizations/`.

          ## Run locally

          ```bash
          python -m venv .venv
          # Windows: .venv\\Scripts\\activate
          # macOS/Linux:
          source .venv/bin/activate
          pip install -r requirements.txt
          python scripts/download_dataset.py --source huggingface
          python scripts/prepare_data.py
          python scripts/smoke_check.py
          pytest -q
          python -m src.train_model
          streamlit run app/streamlit_app.py
          ```

          ## Project contents

          - `app/streamlit_app.py`: interactive News Detector, Model Dashboard, and Methodology & Limitations views.
          - `src/`: preprocessing, TF-IDF/model training, report generation and plotting.
          - `scripts/`: dataset download, data preparation, smoke checks and application evidence capture.
          - `models/model.joblib` and `models/tfidf_vectorizer.joblib`: selected trained estimator and fitted vectorizer.
          - `outputs/evaluation_results/`: measured metrics and model comparison.
          - `outputs/visualizations/`: class distribution, article lengths, comparison and confusion-matrix charts.
          - `Project_Report.pdf`: project report generated from the actual held-out evaluation.
          - `screenshots/` and `demo/`: genuine application screenshots and recorded browser walkthrough.

          ## Screenshots and demonstration

          Application screenshots are in `screenshots/`. The browser demonstration is [demo/NewsGuard_Demo.webm](demo/NewsGuard_Demo.webm). A copy of the run evidence is also retained as the GitHub Actions artifact `newsguard-training-evidence`.

          ## Live deployment

          The application is ready for Streamlit Community Cloud deployment. The repository owner must sign in at [share.streamlit.io](https://share.streamlit.io/), connect this repository, choose branch `main`, and set the main file to `app/streamlit_app.py`. **A live application URL is not claimed yet**; add it here only after deployment succeeds and the public URL is verified.

          ## Limitations

          - Dataset labels are inherited from the source corpus and are not independent fact-check verdicts.
          - The historical English-language corpus has time, topic, geographic and publisher coverage limits.
          - Satire, opinion, short headlines, breaking news and unfamiliar subjects may be misclassified.
          - A prediction reflects learned text patterns; it is not proof of truth or a substitute for source verification.

          ## References

          - [Original Kaggle dataset](https://www.kaggle.com/datasets/clmentbisaillon/fake-and-real-news-dataset)
          - [Hugging Face dataset mirror](https://huggingface.co/datasets/haoxianc/gilchr_fake-and-real-news-dataset)
          - [Scikit-learn documentation](https://scikit-learn.org/stable/)
          - [Streamlit documentation](https://docs.streamlit.io/)
          - [Joblib documentation](https://joblib.readthedocs.io/)
          EOF

          cat > PROJECT_CHECKLIST.md <<'EOF'
          # Major project submission checklist

          Verified by the successful GitHub Actions build, training, application-capture and artifact-validation steps:

          - [x] Complete Python source code and Streamlit application
          - [x] Dataset source, attribution, label mapping and download instructions
          - [x] Preprocessing, EDA and duplicate/missing-value handling
          - [x] TF-IDF fitted on training text only; no test-data leakage
          - [x] Logistic Regression and Multinomial Naive Bayes implementations
          - [x] Held-out accuracy, precision, recall, F1, classification reports and confusion matrices for both models
          - [x] Model comparison and documented Logistic Regression selection
          - [x] Saved Joblib classifier and fitted TF-IDF vectorizer
          - [x] Evaluation results and visualizations
          - [x] Project_Report.pdf regenerated using actual measured results
          - [x] Genuine Streamlit screenshots, including empty-input validation and a sample prediction
          - [x] Browser demonstration recording: [demo/NewsGuard_Demo.webm](demo/NewsGuard_Demo.webm)
          - [ ] Live Streamlit Community Cloud deployment and public URL (requires repository-owner authorization)

          **Measured test results:** Logistic Regression accuracy 99.21%, macro-F1 99.21%; Multinomial Naive Bayes accuracy 96.05%, macro-F1 96.02%. The cleaned corpus contains 38,827 articles (17,901 Fake; 20,926 Real), with 7,766 held-out test articles.

          Raw dataset CSV files are downloaded by the documented script rather than redistributed. Dataset attribution and provenance are included in `data/README.md` and `data/raw/dataset_source.json`.

          **Responsible interpretation:** NewsGuard is a text-pattern classifier, not a fact-checking authority. It may be incorrect, particularly for unfamiliar topics, satire and breaking news.
          EOF

          cat > DEMO_VIDEO.md <<'EOF'
          # NewsGuard demonstration video

          **Recording:** [demo/NewsGuard_Demo.webm](demo/NewsGuard_Demo.webm)

          This browser walkthrough was recorded from the running Streamlit application after the saved model and TF-IDF vectorizer were loaded. It shows the detector interface, empty-input validation, a sample prediction, the model dashboard, and the methodology/limitations view.

          The public Streamlit Community Cloud deployment is a separate owner-authorized step; no live URL is claimed until it is deployed and verified.
          EOF

      - name: Publish trained model and all generated evidence to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f models/model.joblib models/tfidf_vectorizer.joblib data/raw/dataset_source.json
          # This template was extracted from the source bundle, but publishing a new
          # .github/workflows file requires a GitHub App workflows permission not granted here.
          git reset -- .github/workflows/train-and-publish.yml
          git diff --cached --quiet || git commit -m "Publish trained NewsGuard models, metrics, report and demo [skip ci]"
          git push origin HEAD:main

      - name: Preserve evaluation evidence as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsguard-training-evidence
          path: |
            Project_Report.pdf
            models/
            outputs/
            screenshots/
            demo/
          if-no-files-found: warn
          retention-days: 30
